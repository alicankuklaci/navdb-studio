name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  MESA_VERSION: "26.2.4"
  MESA_SHA256: "351FC8C8B695878FFB3EAA044B3EAD08672A48B1A045E3C3E3975811DF0F6695"

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            arch: x64
          # oldest supported runners: keep the glibc requirement of the binary low
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            arch: x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)-dev"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libxkbcommon-dev libwayland-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p navdb-app --target ${{ matrix.target }}

      # asset names carry no version so README links to releases/latest/download/<name> stay valid
      # software OpenGL (Mesa llvmpipe) for machines without a GPU driver, e.g. remote desktop and VMs;
      # navdb.exe loads it from the mesa folder only when no hardware renderer starts
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "NavDB-Studio-windows-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path "dist/$name/mesa" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/navdb.exe" "dist/$name/NavDB Studio.exe"
          $mesa = "mesa3d-${{ env.MESA_VERSION }}-release-msvc.7z"
          Invoke-WebRequest "https://github.com/pal1000/mesa-dist-win/releases/download/${{ env.MESA_VERSION }}/$mesa" -OutFile $mesa
          if ((Get-FileHash $mesa -Algorithm SHA256).Hash -ne "${{ env.MESA_SHA256 }}") { throw "Mesa checksum mismatch" }
          7z x $mesa -omesa-dist "x64/*" | Out-Null
          Get-ChildItem mesa-dist/x64
          foreach ($dll in "opengl32.dll", "libgallium_wgl.dll", "libglapi.dll") {
            if (Test-Path "mesa-dist/x64/$dll") { Copy-Item "mesa-dist/x64/$dll" "dist/$name/mesa/" }
          }
          if (!(Test-Path "dist/$name/mesa/opengl32.dll")) { throw "Mesa opengl32.dll missing" }
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE "dist/$name/"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"
          Remove-Item -Recurse "dist/$name"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          case "${{ matrix.arch }}" in x64) deb=amd64 ;; *) deb=arm64 ;; esac
          scripts/package-linux.sh "target/${{ matrix.target }}/release/navdb" dist "${{ steps.ver.outputs.version }}" $deb
          mv dist/navdb-studio-*-linux-*.tar.gz "dist/NavDB-Studio-linux-${{ matrix.arch }}.tar.gz"
          mv dist/navdb-studio_*.deb "dist/NavDB-Studio-linux-${{ matrix.arch }}.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: navdb-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.deb
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
