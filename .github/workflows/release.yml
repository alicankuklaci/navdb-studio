name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            arch: x64
          - target: aarch64-apple-darwin
            os: macos-14
            arch: arm64
          - target: x86_64-apple-darwin
            os: macos-14
            arch: x64
          # oldest supported runners: keep the glibc requirement of the binary low
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            arch: x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)-dev"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libxkbcommon-dev libwayland-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p navdb-app --target ${{ matrix.target }}

      # asset names carry no version so README links to releases/latest/download/<name> stay valid
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "NavDB-Studio-windows-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/navdb.exe" "dist/$name/NavDB Studio.exe"
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE "dist/$name/"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"
          Remove-Item -Recurse "dist/$name"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          name="NavDB-Studio-macos-${{ matrix.arch }}"
          stage="$(mktemp -d)/$name"
          mkdir -p "$stage"
          scripts/bundle-macos.sh "target/${{ matrix.target }}/release/navdb" "$stage" "${{ steps.ver.outputs.version }}"
          ditto -c -k --keepParent "$stage/NavDB Studio.app" "dist/$name.zip"
          ln -s /Applications "$stage/Applications"
          # hdiutil on hosted runners sometimes fails with "Resource busy"; retry a few times
          for i in 1 2 3 4 5; do
            hdiutil create -volname "NavDB Studio" -srcfolder "$stage" -ov -format UDZO "dist/$name.dmg" && break
            [ "$i" = 5 ] && exit 1
            sleep $((i * 5))
          done

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          case "${{ matrix.arch }}" in x64) deb=amd64 ;; *) deb=arm64 ;; esac
          scripts/package-linux.sh "target/${{ matrix.target }}/release/navdb" dist "${{ steps.ver.outputs.version }}" $deb
          mv dist/navdb-studio-*-linux-*.tar.gz "dist/NavDB-Studio-linux-${{ matrix.arch }}.tar.gz"
          mv dist/navdb-studio_*.deb "dist/NavDB-Studio-linux-${{ matrix.arch }}.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: navdb-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.tar.gz
            dist/*.deb
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
