[package]
name = "navdb-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
uuid = { version = "1", features = ["v4"] }
csv = "1"
regex = "1"
rand = "0.8"
mysql = "25"
postgres = "0.19"
postgres-native-tls = "0.5"
native-tls = "0.2"
rusqlite = { version = "0.32", features = ["bundled", "column_decltype"] }
redis = "0.27"
mongodb = { version = "3.9.1", features = ["sync"] }
duckdb = { version = "1.10506.1", features = ["bundled", "parquet", "json"] }
ureq = { version = "3.4.2", features = ["json"] }
tiberius = { version = "0.13.0", default-features = false, features = ["tds73", "rustls", "chrono"] }
tokio = { version = "1.53.3", features = ["rt", "rt-multi-thread", "net", "time"] }
tokio-util = { version = "0.7.20", features = ["compat"] }
oracle = { version = "0.6.3", optional = true }
scylla = { version = "1.9.0", features = ["rustls-023"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
rustls-native-certs = "0.8"
async-trait = "0.1"
md-5 = "0.11.0"
sha2 = "0.11.1"
sqlparser = "0.63.0"
base64 = "0.23.1"
futures-util = "0.3.34"

[features]
default = ["oracle", "ssh-tunnel", "duckdb-extensions"]
# Oracle loads the Instant Client at runtime; not possible inside the macOS App Sandbox
oracle = ["dep:oracle"]
# tunnels through the system OpenSSH client
ssh-tunnel = []
# DuckDB may download extensions (Iceberg, httpfs, ...) at runtime; the Mac App
# Store forbids downloading executable code, so that build only gets the
# extensions compiled in above
duckdb-extensions = []

[dev-dependencies]
tempfile = "3"
