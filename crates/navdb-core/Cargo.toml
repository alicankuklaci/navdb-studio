[package]
name = "navdb-core"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
uuid = { version = "1", features = ["v4"] }
csv = "1"
regex = "1"
rand = "0.8"
mysql = "25"
postgres = "0.19"
postgres-native-tls = "0.5"
native-tls = "0.2"
rusqlite = { version = "0.32", features = ["bundled", "column_decltype"] }
redis = "0.27"
mongodb = { version = "3.9.1", features = ["sync"] }
duckdb = { version = "1.10506.1", features = ["bundled"] }
ureq = { version = "3.4.2", features = ["json"] }
tiberius = { version = "0.13.0", default-features = false, features = ["tds73", "rustls", "chrono"] }
tokio = { version = "1.53.3", features = ["rt", "net", "time"] }
tokio-util = { version = "0.7.20", features = ["compat"] }
oracle = "0.6.3"
scylla = "1.9.0"
md-5 = "0.11.0"
sha2 = "0.11.1"
sqlparser = "0.63.0"
base64 = "0.23.1"
futures-util = "0.3.34"

[dev-dependencies]
tempfile = "3"
