<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#3D7BFF"/>
      <stop offset="0.55" stop-color="#2450D8"/>
      <stop offset="1" stop-color="#16287A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.12" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D6E6FF"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B9D3FF"/>
      <stop offset="0.45" stop-color="#E9F1FF"/>
      <stop offset="1" stop-color="#93B6F5"/>
    </linearGradient>
    <linearGradient id="needleN" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB347"/>
      <stop offset="1" stop-color="#FF6A1A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000A30" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#06134A" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"/>

  <!-- database: three discs, bottom first -->
  <g filter="url(#soft)">
    <path d="M262 626 v70 a218 66 0 0 0 436 0 v-70 z" fill="url(#side)"/>
    <ellipse cx="480" cy="626" rx="218" ry="66" fill="url(#face)"/>

    <path d="M262 492 v70 a218 66 0 0 0 436 0 v-70 z" fill="url(#side)"/>
    <ellipse cx="480" cy="492" rx="218" ry="66" fill="url(#face)"/>

    <path d="M262 358 v70 a218 66 0 0 0 436 0 v-70 z" fill="url(#side)"/>
    <ellipse cx="480" cy="358" rx="218" ry="66" fill="url(#face)"/>
  </g>
  <!-- navigation badge -->
  <g filter="url(#soft)">
    <circle cx="716" cy="716" r="132" fill="#0F1D5C"/>
    <circle cx="716" cy="716" r="132" fill="none" stroke="#FFFFFF" stroke-width="14"/>
  </g>
  <g transform="translate(716 716) rotate(45)">
    <path d="M0 -98 L34 0 L-34 0 Z" fill="url(#needleN)"/>
    <path d="M0 98 L34 0 L-34 0 Z" fill="#DCE7FF"/>
    <circle r="15" fill="#0F1D5C"/>
    <circle r="7" fill="#FFFFFF"/>
  </g>
</svg>
