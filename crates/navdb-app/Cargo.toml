[package]
name = "navdb-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "navdb"
path = "src/main.rs"

[dependencies]
navdb-core = { path = "../navdb-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
egui = "0.31"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui_extras = { version = "0.31", features = ["syntect", "svg"] }
egui-phosphor = "0.9"
egui_plot = "0.31"
rfd = "0.15"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
