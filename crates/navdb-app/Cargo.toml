[package]
name = "navdb-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "navdb"
path = "src/main.rs"

[features]
default = ["oracle", "ssh-tunnel"]
oracle = ["navdb-core/oracle"]
ssh-tunnel = ["navdb-core/ssh-tunnel"]
# Mac App Store build: App Sandbox file access and StoreKit subscriptions.
# Build with --no-default-features --features appstore (scripts/build-appstore.sh).
appstore = []

[dependencies]
navdb-core = { path = "../navdb-core", default-features = false }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
egui = "0.31"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui_extras = { version = "0.31", features = ["syntect", "svg"] }
egui-phosphor = { version = "0.9", features = ["regular", "fill"] }
egui_plot = "0.31"
rfd = "0.15"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"

# Direct3D/Vulkan first on Windows: many VMs, RDP sessions and stock drivers only offer OpenGL 1.1
[target.'cfg(windows)'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["wgpu"] }

[build-dependencies]
winresource = "0.1"
