[workspace]
resolver = "2"
members = ["crates/navdb-core", "crates/navdb-app"]

[workspace.package]
version = "0.1.6"
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.dev.package."*"]
opt-level = 2

# winit without the private CGS* blur calls that Mac App Store review rejects (see vendor/winit)
[patch.crates-io]
winit = { path = "vendor/winit" }
